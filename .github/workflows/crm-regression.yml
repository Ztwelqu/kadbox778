name: CRM regression tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  finance-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run finance regression tests
        run: node tests/finance-regression.mjs
